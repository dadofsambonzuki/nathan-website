name: Schedule probe

# Temporary: proves a scheduled event reaches the self-hosted runner, which is
# what the daily Nostr pull depends on. Delete once confirmed.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, nathan-website]
    timeout-minutes: 5
    steps:
      - name: Report the trigger
        run: |
          echo "event=${{ github.event_name }} at $(date -u +%FT%TZ) on $(hostname)"
