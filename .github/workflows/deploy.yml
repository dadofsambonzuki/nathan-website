name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

# No schedule here on purpose: the daily Nostr pull is a cron job on the VPS
# (scripts/install-daily-deploy.sh), so it does not depend on GitHub's
# scheduler, which lags, drops runs under load and switches itself off after
# 60 days without repository activity.

concurrency:
  group: deploy-nathan-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nathan-website]
    timeout-minutes: 10
    steps:
      - name: Select the production branch
        run: |
          if ! git -C /home/ubuntu/nathan-website diff --quiet || ! git -C /home/ubuntu/nathan-website diff --cached --quiet; then
            git -C /home/ubuntu/nathan-website stash push --message "auto-stash before switching to master $(date +%Y%m%d-%H%M%S)"
          fi
          git -C /home/ubuntu/nathan-website fetch origin master
          git -C /home/ubuntu/nathan-website switch master
      - name: Run deploy script
        run: /home/ubuntu/nathan-website/scripts/deploy.sh
