name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-nathan-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, nathan-website]
    timeout-minutes: 10
    steps:
      - name: Run deploy script
        run: /home/ubuntu/nathan-website/scripts/deploy.sh
